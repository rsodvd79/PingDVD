[package]
name = "pingdvd"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "PingDVD"
path = "src/main.rs"

[dependencies]
eframe = "0.33.3"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
