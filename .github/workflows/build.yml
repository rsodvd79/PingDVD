name: Build and Release

on:
  push:
    branches: [ Avalonia_dotnet_8 ]
    tags:
      - 'v*'

  pull_request:
    branches: [ Avalonia_dotnet_8 ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Publish for Windows
      if: runner.os == 'Windows'
      run: dotnet publish PingDVD/PingDVD.csproj -c Release -r win-x64 --self-contained false /p:PublishTrimmed=false /p:PublishSingleFile=false --output ./publish/windows

    - name: Publish for macOS
      if: runner.os == 'macOS'
      run: dotnet publish PingDVD/PingDVD.csproj -c Release -r osx-x64 --self-contained false /p:PublishTrimmed=false /p:PublishSingleFile=false --output ./publish/macos

    - name: Create ZIP archive for Windows
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        cd publish/windows
        Compress-Archive -Path * -DestinationPath ../../PingDVD-Windows.zip

    - name: Create ZIP archive for macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        cd publish/macos
        zip -r ../../PingDVD-macOS.zip .

    - name: Upload ZIP artifact
      uses: actions/upload-artifact@v4
      with:
        name: PingDVD-${{ runner.os }}
        path: PingDVD-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/Avalonia_dotnet_8'
    permissions:
      contents: write

    steps:
    - name: Generate tag name
      id: tag
      run: echo "tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        files: artifacts/PingDVD-*.zip
        generate_release_notes: true