name: Build and Release

on:
  push:
  pull_request:

  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.ts.outputs.timestamp }}
    steps:
    - name: Generate timestamp (yyyy.MM.dd.HH.mm)
      id: ts
      run: echo "timestamp=$(date -u +'%Y.%m.%d.%H.%M')" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: Windows
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macOS

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
        components: rustfmt, clippy

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Test
      run: cargo test --locked

    - name: Clippy
      run: cargo clippy --all-targets --all-features --locked -- -D warnings

    - name: Loopback smoke test
      run: cargo test --locked loopback_ipv4_and_ipv6_reply_and_worker_can_restart -- --ignored

    - name: Build release
      run: cargo build --release --locked --target ${{ matrix.target }}

    - name: Create Windows archive
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        Compress-Archive -Path "target/${{ matrix.target }}/release/PingDVD.exe" -DestinationPath "PingDVD.Windows.${{ needs.prepare.outputs.timestamp }}.zip"

    - name: Create .app bundle for macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        APP=PingDVD.app
        mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
        cp "target/${{ matrix.target }}/release/PingDVD" "$APP/Contents/MacOS/PingDVD"
        cp assets/Info.plist "$APP/Contents/"
        cp assets/pingdvd.icns "$APP/Contents/Resources/"
        chmod +x "$APP/Contents/MacOS/PingDVD"

    - name: Create macOS archive
      if: runner.os == 'macOS'
      shell: bash
      run: |
        ditto -c -k --sequesterRsrc --keepParent PingDVD.app "PingDVD.macOS.${{ needs.prepare.outputs.timestamp }}.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: PingDVD-${{ matrix.platform }}-${{ needs.prepare.outputs.timestamp }}
        path: PingDVD.${{ matrix.platform }}.${{ needs.prepare.outputs.timestamp }}.zip

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
    - name: Generate tag name
      id: tag
      run: echo "tag=v${{ needs.prepare.outputs.timestamp }}" >> $GITHUB_OUTPUT

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        files: artifacts/PingDVD.*.zip
        generate_release_notes: true