name: Build and Release

on:
  push:
    branches: [ Avalonia_dotnet_8 ]
    tags:
      - 'v*'

  pull_request:
    branches: [ Avalonia_dotnet_8 ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Test
      run: cargo test

    - name: Build release
      run: cargo build --release --target ${{ matrix.target }}

    - name: Create Windows archive
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        Compress-Archive -Path "target/${{ matrix.target }}/release/PingDVD.exe" -DestinationPath PingDVD-Windows.zip

    - name: Create .app bundle for macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        APP=PingDVD.app
        mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
        cp "target/${{ matrix.target }}/release/PingDVD" "$APP/Contents/MacOS/PingDVD"
        cp assets/Info.plist "$APP/Contents/"
        cp assets/pingdvd.icns "$APP/Contents/Resources/"
        chmod +x "$APP/Contents/MacOS/PingDVD"

    - name: Create macOS archive
      if: runner.os == 'macOS'
      shell: bash
      run: |
        ditto -c -k --sequesterRsrc --keepParent PingDVD.app PingDVD-macOS.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: PingDVD-${{ runner.os }}
        path: PingDVD-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/Avalonia_dotnet_8'
    permissions:
      contents: write

    steps:
    - name: Generate tag name
      id: tag
      run: echo "tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        files: artifacts/PingDVD-*.zip
        generate_release_notes: true